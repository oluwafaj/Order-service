name: Order Service CI/CD Pipeline

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

env:
  REGISTRY_NAME: enterprisejava.azurecr.io
  IMAGE_NAME: order-service
  APP_NAME: enterprise-java

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test with Maven
        run: mvn clean test

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY_NAME }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          IMAGE_URI="$REGISTRY_NAME/$IMAGE_NAME:${{ github.sha }}"
          LATEST_URI="$REGISTRY_NAME/$IMAGE_NAME:latest"
          
          echo "Building image: $IMAGE_URI"
          docker build -t $IMAGE_URI -t $LATEST_URI .
          
          echo "Pushing images..."
          docker push $IMAGE_URI
          docker push $LATEST_URI
  deploy-dev:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Deploy to Dev Slot
        uses: azure/webapps-deploy@v2
        with:
          app-name: enterprise-order-service
          slot-name: dev
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_DEV }}
          images: '${{ secrets.ACR_LOGIN_SERVER }}/order-service:${{ github.sha }}'

  deploy-staging:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to Staging Slot
        uses: azure/webapps-deploy@v2
        with:
          app-name: enterprise-order-service
          slot-name: staging
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
          images: '${{ secrets.ACR_LOGIN_SERVER }}/order-service:${{ github.sha }}'

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to Production
        uses: azure/webapps-deploy@v2
        with:
          app-name: enterprise-order-service
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PROD }}
          images: '${{ secrets.ACR_LOGIN_SERVER }}/order-service:${{ github.sha }}'
